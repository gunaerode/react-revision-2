    <title>React 19 Tutorial</title>
    <script>
      // Applies the saved/preferred theme before first paint, so the page never
      // flashes light and then flips to dark once App.tsx's effect runs. Kept in
      // sync with getInitialTheme() in src/App.tsx.
      (function () {
        var stored = localStorage.getItem("theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
